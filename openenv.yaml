name: "CloudScalerEnv"
version: "1.0.0"
description: "SRE environment for autoscaling and recovery under budget and SLA constraints."
author: "OpenEnv Contributor"
license: "MIT"
tags:
  - "openenv"
  - "devops"
  - "sre"
  - "resource-optimization"

environment:
  entrypoint: "src.env:CloudScalerEnv"
  state_model: "src.models:Observation"
  action_model: "src.models:Action"
  reward_model: "src.models:Reward"

tasks:
  - id: "easy-memory-leak"
    name: "easy-memory-leak"
    task_id: "easy-memory-leak"
    difficulty: "easy"
    description: "Restart a leaking service before crash with minimal overhead."
    entrypoint: "tasks:easy_memory_leak"
    grader: "tasks:grade_easy_result"
    grader_fn: "tasks:grade_easy_result"
    grader_entrypoint: "tasks:grade_easy_result"
    grader_class: "src.graders:EasyGrader"

  - id: "medium-traffic-spike"
    name: "medium-traffic-spike"
    task_id: "medium-traffic-spike"
    difficulty: "medium"
    description: "Handle multi-service CPU spikes while staying near SLA band."
    entrypoint: "tasks:medium_traffic_spike"
    grader: "tasks:grade_medium_result"
    grader_fn: "tasks:grade_medium_result"
    grader_entrypoint: "tasks:grade_medium_result"
    grader_class: "src.graders:MediumGrader"

  - id: "hard-cascading-failure"
    name: "hard-cascading-failure"
    task_id: "hard-cascading-failure"
    difficulty: "hard"
    description: "Prevent cascading failures across dependencies under tight budget."
    entrypoint: "tasks:hard_cascading_failure"
    grader: "tasks:grade_hard_result"
    grader_fn: "tasks:grade_hard_result"
    grader_entrypoint: "tasks:grade_hard_result"
    grader_class: "src.graders:HardGrader"

graders:
  easy-memory-leak:
    entrypoint: "tasks:grade_easy_result"
    class_entrypoint: "src.graders:EasyGrader"
    task_loader: "tasks:easy_memory_leak"
  medium-traffic-spike:
    entrypoint: "tasks:grade_medium_result"
    class_entrypoint: "src.graders:MediumGrader"
    task_loader: "tasks:medium_traffic_spike"
  hard-cascading-failure:
    entrypoint: "tasks:grade_hard_result"
    class_entrypoint: "src.graders:HardGrader"
    task_loader: "tasks:hard_cascading_failure"
